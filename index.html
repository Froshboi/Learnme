<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f4f8">
<meta name="description" content="A friendly, hands-on UI/UX design course with guided lessons, interactive studios, quizzes, and score-based practice.">
<title>Learnme — UI/UX Design Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --ink:#101828; --muted:#55607A; --line:#D9DEE8;
  --accent:#2B50E6; --accent-ink:#FFFFFF; --accent-soft:#E6ECFF;
  --ok:#12805C; --ok-soft:#DDF3EA; --bad:#B8302A; --bad-soft:#FBE4E2;
  --display:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
  --body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1320; --surface:#161D2E; --ink:#EEF1F8; --muted:#9AA5BF; --line:#2A3350;
    --accent:#8AA2FF; --accent-ink:#0E1320; --accent-soft:#1E2850;
    --ok:#5FD2A0; --ok-soft:#14352B; --bad:#FF8A80; --bad-soft:#3A1B1B;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1320; --surface:#161D2E; --ink:#EEF1F8; --muted:#9AA5BF; --line:#2A3350;
  --accent:#8AA2FF; --accent-ink:#0E1320; --accent-soft:#1E2850;
  --ok:#5FD2A0; --ok-soft:#14352B; --bad:#FF8A80; --bad-soft:#3A1B1B;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;letter-spacing:-0.02em}
h1{font-size:clamp(36px,10vw,56px);font-weight:800}
h2{font-size:clamp(26px,6.5vw,34px);font-weight:700}
h3{font-size:21px;font-weight:700;letter-spacing:-0.01em}
p{margin:0 0 12px}
a{color:var(--accent)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:720px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px}
.brand{font-family:var(--display);font-weight:700;color:var(--ink);text-decoration:none;white-space:nowrap}
.prog{flex:1;height:8px;background:var(--line);border-radius:8px;overflow:hidden}
.prog span{display:block;height:100%;width:0;background:var(--accent);border-radius:8px;transition:width .4s}
.prog-label{font-size:14px;color:var(--muted);white-space:nowrap}

.wrap{max-width:720px;margin:0 auto;padding:28px 20px 72px}
.stack>*+*{margin-top:24px}
.muted{color:var(--muted)}
.small{font-size:15px}
.back{display:inline-flex;align-items:center;min-height:44px;color:var(--muted);text-decoration:none;margin-bottom:8px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 20px;text-decoration:none;color:var(--ink);min-height:72px}
.row:hover{border-color:var(--accent)}
.row-title{font-family:var(--display);font-weight:700;font-size:19px;line-height:1.2}
.pill{font-size:14px;font-weight:600;padding:4px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.done{background:var(--ok-soft);color:var(--ok)}
.pill.locked{background:var(--line);color:var(--muted)}

.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 24px;border-radius:12px;border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--accent)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:12px}

/* hero demo */
.demo{display:grid;gap:16px}
.demo-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;transition:all .3s}
.demo-card .d-title{color:var(--muted);font-size:16px;margin-bottom:6px}
.demo-card .d-body{color:var(--muted);font-size:16px;margin-bottom:6px}
.demo-card .d-btn{display:inline-block;color:var(--muted);font-size:16px;padding:0;background:none;border:0;border-radius:12px;min-height:0}
.demo-card.on .d-title{font-family:var(--display);font-weight:800;font-size:28px;color:var(--ink);margin-bottom:8px;line-height:1.1}
.demo-card.on .d-body{margin-bottom:24px}
.demo-card.on .d-btn{background:var(--accent);color:var(--accent-ink);font-weight:600;padding:0 24px;min-height:48px;line-height:48px}

/* lessons */
.lesson ul{margin:12px 0;padding-left:22px}
.lesson li{margin-bottom:8px;max-width:62ch}
.idea{border-left:4px solid var(--accent);background:var(--accent-soft);padding:12px 16px;border-radius:0 12px 12px 0;margin-top:16px}
.lesson-id{font-family:var(--display);color:var(--accent);margin-right:8px}
.task{border-left:4px solid var(--ok)}
.task dt{font-weight:600;margin-top:12px}
.task dd{margin:2px 0 0}

/* labs */
.lab label{display:block;font-weight:600;font-size:15px;margin-bottom:4px}
.lab-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.lab input[type=number],.lab select{width:100%;min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.lab input[type=color]{width:100%;height:44px;padding:2px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.lab-out{display:grid;gap:16px;margin-top:8px}
.cl-card{background:var(--bg);border:1px dashed var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;align-items:flex-start}
.cl-title{font-family:var(--display);font-weight:700;color:var(--ink)}
.cl-body{color:var(--muted);margin-bottom:16px}
.cl-btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:0 20px;font-weight:600}
.score{font-family:var(--display);font-size:32px;font-weight:800}
.fb{margin:8px 0 0;padding-left:20px}
.sample{border-radius:12px;padding:16px;border:1px solid var(--line)}
.ratio{font-family:var(--display);font-size:32px;font-weight:800}
.chk{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}

/* quiz */
.qbar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:20px}
.qbar span{display:block;height:100%;background:var(--accent)}
.opts{display:grid;gap:12px;margin:20px 0}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;min-height:56px;padding:12px 16px;border-radius:12px;border:2px solid var(--line);background:var(--surface);cursor:pointer}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .ltr{font-family:var(--display);font-weight:700;color:var(--muted);min-width:20px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.explain{padding:12px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line);margin-bottom:16px}
.big-score{font-family:var(--display);font-weight:800;font-size:clamp(56px,16vw,88px);line-height:1}

/* answer key */
.k-q{padding:16px 0;border-top:1px solid var(--line)}
.k-q:first-of-type{border-top:0}
.k-a{color:var(--ok);font-weight:600}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (min-width:560px){.lab-out{grid-template-columns:1fr 1fr}}

/* ---------- Studio (Part 2) ---------- */
.navlink{font-weight:600;text-decoration:none;color:var(--accent);min-height:44px;display:inline-flex;align-items:center;padding:0 4px}
.btn.sm{min-height:44px;padding:0 14px;font-size:15px}
.tipbox{border-left:4px solid #F5B301}
.mk-card{background:var(--bg);border:1px dashed var(--line);border-radius:12px;padding:20px}
.mk-btn{display:inline-flex;align-items:center;padding:0 20px;min-height:44px;border-radius:10px}
.mui{background:#fff;color:#1a1a1a;border-radius:12px;padding:16px;border:1px solid #ccd2de}
.ctl-grp{margin-top:16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:6px 8px 0 0;background:var(--bg)}
.seg button{min-height:44px;padding:0 14px;border:0;background:transparent;cursor:pointer;font-size:15px}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.sl{margin-top:16px}
.sl-top{display:flex;justify-content:space-between;gap:12px;font-size:15px}
.sl-row{display:flex;gap:8px;align-items:center}
.sl-row input{flex:1;min-height:44px;accent-color:var(--accent);min-width:0}
.stp{width:44px;height:44px;flex:none;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:22px;cursor:pointer}
.padbox{background:var(--accent-soft);border-radius:12px}
.padin{background:var(--surface);border-radius:6px;padding:0}
.gb{background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--accent);overflow:hidden}
.padin .lab{font-weight:600;font-size:15px}
.padin .fld{height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.tsr{display:flex;gap:12px;align-items:baseline;margin-bottom:6px}
.tsr>span{width:44px;flex:none}
.fit{overflow:hidden;background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:0}
.ct-item{padding:16px 0;border-top:1px solid var(--line)}
.ct-item:first-child{border-top:0;padding-top:0}
.ratio-line{margin-top:8px;font-weight:600;color:var(--bad)}
.ratio-line.okr{color:var(--ok)}
.hot{display:block;width:100%;text-align:left;background:none;border:2px solid transparent;border-radius:8px;padding:2px;margin:0;font:inherit;color:inherit;cursor:pointer}
.hot.flag{border-color:#2B50E6;background:rgba(43,80,230,.1)}
.hot.bad{border-color:#D92D20;background:rgba(217,45,32,.12)}
.swr{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.swt{min-height:56px;border-radius:10px;border:3px solid transparent;font-weight:600;cursor:pointer;outline:1px solid var(--line)}
.swt.on{border-color:var(--ink)}
.reg{cursor:pointer}
.phone{width:100%;max-width:300px;margin:0 auto;background:#fff;border:3px solid #333;border-radius:26px;padding:12px;min-height:220px;display:flex;flex-direction:column;gap:8px}
.wf{background:#E4E6EA;border:2px solid transparent;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#444;font-size:13px;cursor:pointer;padding:6px}
.wf.sel{border-color:#2B50E6;background:#D5DEFF}
.wf-img{background:linear-gradient(to top right,transparent calc(50% - 1px),#999,transparent calc(50% + 1px)),linear-gradient(to bottom right,transparent calc(50% - 1px),#999,transparent calc(50% + 1px)),#E4E6EA}
.wf-ad{background:repeating-linear-gradient(45deg,#E4E6EA,#E4E6EA 8px,#D4D7DD 8px,#D4D7DD 16px)}
.wf-btn{background:#9AA3B5;color:#fff;border-radius:10px;font-weight:600}
.wf .bars{width:100%;display:grid;gap:8px}
.wf .bars i{display:block;height:8px;border-radius:4px;background:#B9BECA}
.wf .dots{display:flex;gap:22px}
.wf .dots i{display:block;width:16px;height:16px;border-radius:50%;background:#B9BECA}
.fnode{margin:0 auto;text-align:center;padding:12px 16px;max-width:260px;background:var(--surface);border:2px dashed var(--line);border-radius:6px}
.fnode.fn-term{border:2px solid var(--accent);border-radius:999px}
.fnode.fn-step{border:2px solid var(--accent);border-radius:6px}
.fnode.fn-dec{border:0;background:var(--accent-soft);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);padding:34px 40px}
.arrow{text-align:center;color:var(--muted);font-size:20px;line-height:1.2}
.rl{list-style:none;padding:0;margin:12px 0}
.rl li{display:flex;gap:10px;padding:6px 0;align-items:flex-start}
.rl .mark{width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex:none;margin-top:1px}
.rl li.ok .mark{background:var(--ok);color:var(--bg)}
.rl li.no .mark{background:var(--line);color:var(--muted)}
.fb-card.win{border-color:var(--ok);background:var(--ok-soft)}
.center{text-align:center}
.stars{display:flex;gap:8px;justify-content:center;font-size:64px;line-height:1}
.stars span{color:var(--line)}
.stars span.on{color:#F5B301;animation:pop .55s cubic-bezier(.2,1.6,.4,1) backwards}
@keyframes pop{0%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}
.xp-row{display:flex;justify-content:space-between;align-items:baseline}
.xp-gain{font-family:var(--display);font-size:32px;color:var(--ok)}
.xpbar{height:12px;background:var(--line);border-radius:12px;overflow:hidden}
.xpbar span{display:block;height:100%;background:var(--accent);border-radius:12px;transition:width .6s}
.lvl-top{display:flex;justify-content:space-between;align-items:flex-start}
.grade{text-align:center}
.grade b{display:block;font-family:var(--display);font-size:40px;line-height:1;color:var(--ok)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.stat{background:var(--bg);border-radius:12px;padding:12px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:26px;line-height:1.1}
.skill{display:grid;grid-template-columns:96px 1fr 44px;gap:10px;align-items:center;margin:10px 0;font-size:15px}
.skill b{text-align:right}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.badge{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;font-size:14px}
.badge .muted{font-size:13px}
.badge.off{opacity:.45}
.badge .bi{display:flex;width:44px;height:44px;margin:0 auto 6px;border-radius:50%;background:var(--accent-soft);color:var(--accent);align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:18px}
.path{display:flex;flex-direction:column;align-items:center;gap:20px;padding:4px 0 12px}
.unit-h{align-self:stretch;background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:14px 18px;margin-top:8px}
.node{display:flex;flex-direction:column;align-items:center;text-decoration:none;color:var(--ink);width:170px;text-align:center}
.nd{width:76px;height:76px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:28px;background:var(--accent);color:var(--accent-ink);border-bottom:6px solid rgba(0,0,0,.25)}
.nd.done{background:var(--ok);color:var(--bg)}
.nd.lock{background:var(--line);color:var(--muted);border-bottom-color:transparent;font-size:24px}
.nd.cur{animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(43,80,230,.45)}50%{box-shadow:0 0 0 14px rgba(43,80,230,0)}}
.nt{font-weight:600;margin-top:8px;line-height:1.2}
.ns{color:#F5B301;font-size:20px;letter-spacing:2px}
.ns .dim{color:var(--line)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
@media (prefers-reduced-motion:reduce){.nd.cur,.stars span.on{animation:none}}

/* ---------- Learner dashboard refresh ---------- */
:root{--accent:#3158e8;--accent-soft:#e9edff;--bg:#f6f7fb}
:root[data-theme="dark"]{--accent:#9aafff;--accent-soft:#202b50;--bg:#0c1220}
body{background:radial-gradient(ellipse at 50% -24%,rgba(49,88,232,.1),transparent 55%),var(--bg)}
.top{background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.top-in{max-width:1160px;padding:12px 28px;gap:20px}
.brand{font-size:19px;letter-spacing:-.03em}
.navlink{padding:0 12px;border-radius:999px;background:var(--accent-soft);white-space:nowrap}
.theme-toggle{width:44px;height:44px;flex:none;border:1px solid var(--line);border-radius:50%;background:var(--surface);cursor:pointer;font-size:19px}
.wrap{max-width:1160px;padding:40px 28px 88px}
.stack>*+*{margin-top:28px}
.row{transition:transform .2s,border-color .2s,box-shadow .2s}
.row:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(25,38,75,.08)}
.home-stack{gap:26px}
.home-hero{position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(240px,.75fr);gap:28px;align-items:center;background:linear-gradient(130deg,var(--surface) 40%,var(--accent-soft));border:1px solid var(--line);border-radius:28px;padding:clamp(26px,5vw,56px)}
.home-hero>*{min-width:0}
.home-hero:after{content:"";position:absolute;width:240px;height:240px;right:-66px;top:-112px;border:1px solid color-mix(in srgb,var(--accent) 28%,transparent);border-radius:50%;box-shadow:0 0 0 24px color-mix(in srgb,var(--accent) 5%,transparent),0 0 0 48px color-mix(in srgb,var(--accent) 4%,transparent);pointer-events:none}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:14px}
.home-hero h1{max-width:13ch;font-size:clamp(42px,6vw,70px)}
.home-hero p{font-size:18px;max-width:49ch;margin:16px 0 24px}
.hero-actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.hero-side{position:relative;z-index:1;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px}
.hero-score{display:flex;justify-content:space-between;align-items:center;gap:12px}
.hero-score strong{font-family:var(--display);font-size:44px;line-height:1}
.dash-progress{height:12px;margin:18px 0 8px;background:var(--line);border-radius:999px;overflow:hidden}
.dash-progress span{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),#41b89a);transition:width .5s}
.dash-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.dash-stat{padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.dash-stat b{display:block;font:700 27px/1.1 var(--display)}
.dash-stat span{display:block;margin-top:5px}
.section-heading{display:flex;align-items:end;justify-content:space-between;gap:16px}
.section-heading h2{font-size:clamp(25px,4vw,32px)}
.module-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.module-card{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;min-height:112px;padding:18px;background:var(--surface);border:1px solid var(--line);border-radius:18px;text-decoration:none;color:var(--ink);transition:transform .2s,border-color .2s,box-shadow .2s}
.module-card:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:0 10px 30px rgba(25,38,75,.08)}
.module-num{width:44px;height:44px;display:grid;place-items:center;border-radius:14px;background:var(--accent-soft);color:var(--accent);font:700 18px var(--display)}
.module-card.complete .module-num{background:var(--ok-soft);color:var(--ok)}
.module-title{font:700 18px/1.2 var(--display)}
.module-meta{font-size:14px;color:var(--muted);margin-top:5px}
.module-score{padding:7px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:700;white-space:nowrap}
.module-card.complete .module-score{background:var(--ok-soft);color:var(--ok)}
.home-lower{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}
.home-panel{padding:22px;background:var(--surface);border:1px solid var(--line);border-radius:20px}
.home-panel h3{margin-bottom:10px}
.studio-banner{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:16px;padding:16px;background:var(--accent-soft);border-radius:14px;text-decoration:none;color:var(--ink)}
.studio-banner strong{display:block;font:700 18px var(--display)}
.studio-banner .pill{background:var(--surface)}
.notice{max-width:1160px;margin:0 auto;padding:8px 28px;color:var(--bad);font-size:14px}
.test-plan{display:grid;gap:14px}
.test-field{display:grid;gap:6px}
.test-field label{font-weight:600;font-size:15px}
.test-field select,.test-field input{width:100%;min-height:48px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.plan-score{display:flex;align-items:center;gap:14px;margin-top:4px;padding:16px;border-radius:14px;background:var(--accent-soft)}
.plan-score strong{font:800 32px/1 var(--display);color:var(--accent)}
.plan-feedback{list-style:none;padding:0;margin:0}
.plan-feedback li{padding:8px 0;border-bottom:1px solid var(--line)}
.plan-feedback li:last-child{border-bottom:0}
.plan-feedback .pass{color:var(--ok)}.plan-feedback .improve{color:var(--bad)}
@media(max-width:760px){.top-in{padding:10px 16px;gap:10px}.wrap{padding:26px 16px 64px}.home-hero{grid-template-columns:1fr}.hero-side{max-width:480px}.home-lower{grid-template-columns:1fr}.notice{padding:8px 16px}}
@media(max-width:560px){.top-in{gap:8px}.brand{font-size:16px}.navlink{font-size:14px;padding:0 10px}.prog-label{font-size:12px}.module-grid{grid-template-columns:1fr}.module-card{min-height:96px;padding:14px}.home-hero{padding:24px 20px}.home-hero .eyebrow{letter-spacing:.08em}.hero-side{padding:18px}.dash-stats{gap:8px}.dash-stat{padding:12px}.dash-stat b{font-size:23px}.section-heading{align-items:start;flex-direction:column}}
@media(max-width:380px){.top-in{padding:10px 12px;gap:6px}.brand{font-size:14px}.navlink{font-size:13px;padding:0 8px}.prog-label{font-size:11px}.theme-toggle{width:40px;height:40px}.hero-actions{align-items:stretch;flex-direction:column}.hero-actions .btn{width:100%;padding:0 12px;white-space:normal;text-align:center}}
@media(min-width:760px){.test-plan{grid-template-columns:repeat(2,minmax(0,1fr))}.plan-score,.plan-feedback{grid-column:1/-1}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <a class="brand" href="#/">Learnme <span style="color:var(--accent)">/</span> Studio</a>
  <a class="navlink" href="#/studio" aria-label="Practice studio">Studio</a>
  <div class="prog" role="progressbar" aria-label="Course milestones" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progbar"><span id="progfill"></span></div>
  <span class="prog-label" id="proglabel">0%</span>
  <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark theme" aria-pressed="false">☾</button>
</div></header>
<div class="notice" id="storage-notice" role="status" hidden></div>
<main class="wrap" id="app"></main>

<script>
(function(){
let C, Q;
const app = document.getElementById('app');
const KEY = 'uiux-course-v1';
let store = {quiz:{}, final:null};
function warnStorage(){
  const notice = document.getElementById('storage-notice');
  if (notice){ notice.hidden = false; notice.textContent = 'Your browser could not save progress or workspace drafts. Check that site storage is enabled; your work may not be here next time.'; }
}
try { const s = localStorage.getItem(KEY); if (s) store = Object.assign(store, JSON.parse(s)); } catch(e){ warnStorage(); }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e){ warnStorage(); } }
const themeButton = document.getElementById('theme-toggle');
function updateThemeButton(){
  const dark = document.documentElement.dataset.theme === 'dark' || (!document.documentElement.dataset.theme && window.matchMedia('(prefers-color-scheme: dark)').matches);
  themeButton.textContent = dark ? '☼' : '☾';
  themeButton.setAttribute('aria-label',dark?'Switch to light theme':'Switch to dark theme');
  themeButton.setAttribute('aria-pressed',String(dark));
}
try { const theme = localStorage.getItem('uiux-theme'); if (theme==='light'||theme==='dark') document.documentElement.dataset.theme = theme; } catch(e){ warnStorage(); }
updateThemeButton();
themeButton.addEventListener('click', () => {
  const dark = document.documentElement.dataset.theme === 'dark' || (!document.documentElement.dataset.theme && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'light' : 'dark';
  updateThemeButton();
  try { localStorage.setItem('uiux-theme',document.documentElement.dataset.theme); } catch(e){ warnStorage(); }
});
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const L = 'ABCD';
const modQ = n => Q.modules.find(m => m.module_number === n);
const modC = n => C.modules.find(m => m.module_number === n);

function updateProgress(){
  const total = C.modules.length + 1;
  const done = C.modules.filter(m => store.quiz[m.module_number]).length + (store.final ? 1 : 0);
  const pct = Math.round(done / total * 100);
  document.getElementById('progfill').style.width = pct + '%';
  document.getElementById('progbar').setAttribute('aria-valuenow', pct);
  document.getElementById('proglabel').textContent = pct + '%';
}

/* ---------- Home ---------- */
function home(){
  const rows = C.modules.map((m,i) => {
    const r = store.quiz[m.module_number];
    const pct = r ? Math.round((r.bestScore??r.score)/r.total*100) : null;
    return `<a class="module-card ${r?'complete':''}" href="#/m/${m.module_number}">
      <span class="module-num">${r?'✓':String(i+1).padStart(2,'0')}</span>
      <span><span class="module-title">${esc(m.title)}</span>
      <span class="module-meta">Week ${m.week} · ${m.lessons.length} short lessons</span></span>
      <span class="module-score">${r ? (pct>=80?'✓ ':'')+pct+'%' : 'Explore'}</span></a>`;
  }).join('');
  const f = store.final, completed = C.modules.filter(m => store.quiz[m.module_number]).length;
  const quizResults = Object.values(store.quiz).filter(r => r && r.total>0);
  const avg = quizResults.length ? Math.round(quizResults.reduce((sum,r) => sum+(r.bestScore ?? r.score)/r.total*100,0)/quizResults.length) : null;
  const done = completed + (f?1:0), total = C.modules.length+1, pct = Math.round(done/total*100);
  const next = C.modules.find(m => !store.quiz[m.module_number]);
  const nextHref = next ? '#/m/'+next.module_number : (!f ? '#/quiz/final' : '#/studio');
  const nextLabel = next ? (completed ? 'Pick up where you left off' : 'Start learning') : (!f ? 'Take your final exam' : 'Keep practicing');
  const nextTitle = next ? 'Week '+next.week+': '+next.title : (!f ? Q.final.title : 'Hands-on Studio');
  const studio = studioStats();
  return `<div class="stack home-stack">
    <section class="home-hero" aria-labelledby="welcome-title">
      <div><div class="eyebrow">Your design journey · ${C.modules.length} weeks · beginner friendly</div>
        <h1 id="welcome-title">Learn to design with confidence.</h1>
        <p class="muted">Build real UI/UX skills in small steps: understand the principles, practice in a safe space, then prove what you know.</p>
        <div class="hero-actions"><a class="btn" href="${nextHref}">${nextLabel} <span aria-hidden="true">&nbsp;→</span></a>
        <span class="muted small">${esc(nextTitle)}</span></div></div>
      <aside class="hero-side" aria-label="Course progress summary">
        <div class="hero-score"><div><div class="eyebrow">Course progress</div><strong>${pct}%</strong></div>
          <span class="pill ${pct===100?'done':''}">${done}/${total} checkpoints</span></div>
        <div class="dash-progress" role="progressbar" aria-label="Course milestones" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><span style="width:${pct}%"></span></div>
        <p class="muted small">${pct===100?'Course complete. Keep sharpening your skills in the studio.':(total-done)+' course '+((total-done)===1?'checkpoint':'checkpoints')+' left · '+(C.modules.length-completed)+' week '+((C.modules.length-completed)===1?'quiz':'quizzes')+' and '+(f?'final complete':'final exam')}</p>
      </aside>
    </section>
    <section class="dash-stats" aria-label="Learning stats">
      <div class="dash-stat"><b>${completed}/${C.modules.length}</b><span class="muted small">week quizzes</span></div>
      <div class="dash-stat"><b>${avg===null?'—':avg+'%'}</b><span class="muted small">quiz average</span></div>
      <div class="dash-stat"><b>${studio.done}/${EX.length}</b><span class="muted small">studio challenges</span></div>
    </section>
    <section aria-labelledby="path-title">
      <div class="section-heading"><div><div class="eyebrow">The learning path</div><h2 id="path-title">One good step at a time</h2></div>
        <span class="muted small">${Q.final.questions.length} final questions · instant quiz feedback</span></div>
      <div class="module-grid" style="margin-top:16px">${rows}
        <a class="module-card ${f?'complete':''}" href="#/quiz/final"><span class="module-num">${f?'✓':'★'}</span>
          <span><span class="module-title">${esc(Q.final.title)}</span>
          <span class="module-meta">${Q.final.questions.length} questions · all ${C.modules.length} weeks</span></span>
          <span class="module-score">${f?Math.round((f.bestScore??f.score)/f.total*100)+'%':'Ready'}</span></a>
      </div>
    </section>
    <div class="home-lower">
      <section class="home-panel"><div class="eyebrow">Make it stick</div><h3>Practice, experiment, improve.</h3>
        <p class="muted">Try interactive design challenges, earn stars, and see exactly which skills to strengthen. Your best work and XP stay saved on this device.</p>
        <a class="studio-banner" href="#/studio"><span><strong>Open the hands-on studio</strong><span class="muted small">${studio.done?studio.done+' of '+EX.length+' challenges complete · '+st.xp+' XP':EX.length+' interactive challenges · scores, stars & skill feedback'}</span></span><span class="pill">Explore →</span></a>
      </section>
      <section class="home-panel"><div class="eyebrow">Study smart</div><h3>Learn, try, check.</h3>
        <p class="muted">Each week has bite-size lessons and examples. Practice quizzes explain every answer right away; save the final exam for when you feel ready.</p>
        <p class="muted small" style="margin:14px 0 0">${f?'<a href="#/key">Review your answer key and task examples →</a>':'Answer key unlocks after the final exam.'}</p>
      </section>
    </div>
  </div>`;
}

/* ---------- Module ---------- */
function labHTML(kind){
  if (kind === 'test_plan_lab') return `<section class="card lab" aria-labelledby="tp-title">
    <h3 id="tp-title">Usability test-plan workbench</h3>
    <p class="muted small">Build a fair, useful five-person test. Your draft saves on this device; improve it until it scores 80+.</p>
    <div class="test-plan" id="test-plan" style="margin-top:16px">
      <div class="test-field"><label for="tp-task">1. Write a task for the participant</label>
        <select id="tp-task"><option value="leading">Tap the blue button to save this article.</option><option value="goal">Save this article so you can find it again.</option><option value="vague">Tell me what you think about this screen.</option></select></div>
      <div class="test-field"><label for="tp-measure">2. Choose a success measure</label>
        <select id="tp-measure"><option value="opinion">Ask whether the screen feels easy.</option><option value="completion">Participant finds and saves the article without help.</option><option value="clicks">Count every click, even if the task fails.</option></select></div>
      <div class="test-field"><label for="tp-prompt">3. Choose a neutral moderator prompt</label>
        <select id="tp-prompt"><option value="hint">The save button is in the top-right corner.</option><option value="neutral">What are you expecting to happen here?</option><option value="leading">You should tap the bookmark icon.</option></select></div>
      <div class="test-field"><label for="tp-participants">4. Set the number of participants</label>
        <input id="tp-participants" type="number" min="1" max="12" value="3" inputmode="numeric"></div>
      <div class="test-field"><label for="tp-inclusive">5. Plan an inclusive setup</label>
        <select id="tp-inclusive"><option value="narrow">Test with one friend on my laptop.</option><option value="inclusive">Include varied access needs and keyboard-only use.</option></select></div>
      <div class="plan-score" aria-live="polite"><strong id="tp-score">0/100</strong><span id="tp-summary">Make a change to improve your test plan.</span></div>
      <ul class="plan-feedback" id="tp-feedback" aria-live="polite"></ul>
    </div></section>`;
  if (kind === 'card_lab') return `<section class="card lab" aria-labelledby="cl-h">
    <h3 id="cl-h">Card hierarchy lab</h3>
    <p class="muted small">Task T1. Adjust the numbers until the card passes every rule.</p>
    <div class="lab-grid">
      <div><label for="cl-title">Title size (px)</label><input id="cl-title" type="number" inputmode="numeric" value="16"></div>
      <div><label for="cl-body">Body size (px)</label><input id="cl-body" type="number" inputmode="numeric" value="16"></div>
      <div><label for="cl-gap">Title to body gap (px)</label><input id="cl-gap" type="number" inputmode="numeric" value="13"></div>
      <div><label for="cl-btn">Button height (px)</label><input id="cl-btn" type="number" inputmode="numeric" value="36"></div>
      <div style="grid-column:1/-1"><label for="cl-order">Order, top to bottom</label>
        <select id="cl-order"><option value="btb">Button, title, body</option><option value="tbb">Title, body, button</option></select></div>
    </div>
    <div class="lab-out">
      <div class="cl-card" id="cl-card"></div>
      <div><div class="score" id="cl-score"></div><ul class="fb" id="cl-fb"></ul></div>
    </div></section>`;
  if (kind === 'contrast_lab') return `<section class="card lab" aria-labelledby="ct-h">
    <h3 id="ct-h">Contrast checker</h3>
    <p class="muted small">Try your task T3 palette. Normal text needs 4.5:1, large text 3:1.</p>
    <div class="lab-grid">
      <div><label for="ct-fg">Text color</label><input id="ct-fg" type="color" value="#8a8f98"></div>
      <div><label for="ct-bg">Background color</label><input id="ct-bg" type="color" value="#ffffff"></div>
    </div>
    <div class="lab-out">
      <div class="sample" id="ct-sample"><strong style="font-size:24px">Large heading</strong><br>Normal body text for reading.</div>
      <div><div class="ratio" id="ct-ratio"></div><div class="chk" id="ct-chk"></div></div>
    </div></section>`;
  return '';
}

function initTestPlanLab(){
  const root = document.getElementById('test-plan');
  if (!root) return;
  const ids = ['tp-task','tp-measure','tp-prompt','tp-participants','tp-inclusive'];
  const draftKey = 'uiux-usability-plan-v1';
  try {
    const draft = JSON.parse(localStorage.getItem(draftKey) || '{}');
    ids.forEach(id => { if (typeof draft[id] === 'string' && root.querySelector('#'+id)) root.querySelector('#'+id).value = draft[id]; });
  } catch(e){ warnStorage(); }
  function scorePlan(){
    const values = Object.fromEntries(ids.map(id => [id,root.querySelector('#'+id).value]));
    const n = Number(values['tp-participants']);
    const checks = [
      [values['tp-task']==='goal','The task describes a real user goal without giving away the interface.'],
      [values['tp-measure']==='completion','Success is observable: the participant completes the task without help.'],
      [values['tp-prompt']==='neutral','The moderator prompt is open-ended and does not point to the answer.'],
      [Number.isInteger(n) && n>=5 && n<=8,'Plan a focused first round with 5–8 participants.'],
      [values['tp-inclusive']==='inclusive','The setup considers varied access needs and keyboard use.']
    ];
    const points = checks.filter(([ok]) => ok).length*20;
    root.querySelector('#tp-score').textContent = points+'/100';
    root.querySelector('#tp-summary').textContent = points>=80 ? 'Strong plan. You are ready to run a useful first test.' : points>=60 ? 'Good start. Refine the flagged areas before testing.' : 'Keep improving: each criterion makes results more trustworthy.';
    root.querySelector('#tp-feedback').innerHTML = checks.map(([ok,text]) => '<li class="'+(ok?'pass':'improve')+'">'+(ok?'✓ ':'○ ')+esc(text)+'</li>').join('');
    try { localStorage.setItem(draftKey, JSON.stringify(values)); } catch(e){ warnStorage(); }
  }
  ids.forEach(id => root.querySelector('#'+id).addEventListener('input', scorePlan));
  scorePlan();
}

function module(n){
  const m = modC(n); if (!m) return '<p>Module not found.</p>';
  const t = C.tasks.find(x => x.module_number === n);
  const r = store.quiz[n];
  const lessons = m.lessons.map(l => `<article class="card lesson">
    <h3><span class="lesson-id">${esc(l.id)}</span> ${esc(l.title)}</h3>
    <ul>${l.concepts.map(c => `<li>${esc(c)}</li>`).join('')}</ul>
    ${l.example ? `<p class="muted small" style="margin:12px 0 0"><strong>Try it.</strong> ${esc(l.example)}</p>` : ''}
    <div class="idea"><strong>Key idea.</strong> ${esc(l.takeaway)}</div></article>`).join('');
  const next = n < C.modules.length ? `<a class="btn ghost" href="#/m/${n+1}">Next module</a>` : `<a class="btn ghost" href="#/quiz/final">Final exam</a>`;
  return `<div class="stack">
    <div><a class="back" href="#/">Back to course</a>
    <p class="muted small" style="margin-bottom:4px">Week ${m.week} of ${C.modules.length}</p>
    <h1 style="font-size:clamp(32px,9vw,46px)">${esc(m.title)}</h1>
    <p class="muted" style="margin-top:12px">${esc(m.summary)}</p></div>
    ${lessons}
    ${labHTML(m.lab)}
    ${t ? `<section class="card task"><h3>Task ${esc(t.task_id)}: ${esc(t.title)}</h3>
      <dl style="margin:0"><dt>Objective</dt><dd>${esc(t.objective)}</dd><dt>Constraints</dt><dd>${esc(t.constraints)}</dd></dl></section>` : ''}
    <div class="btns"><a class="btn" href="#/quiz/${n}">${r ? 'Retake quiz ('+r.score+'/'+r.total+')' : 'Take the module quiz'}</a>${next}</div>
  </div>`;
}

function initCardLab(){
  const g = id => document.getElementById(id);
  if (!g('cl-card')) return;
  function run(){
    const t = +g('cl-title').value||0, b = +g('cl-body').value||0, gap = +g('cl-gap').value||0, h = +g('cl-btn').value||0, order = g('cl-order').value;
    const T = `<div class="cl-title" style="font-size:${t}px;margin-bottom:${gap}px">Weekend market</div>`;
    const B = `<div class="cl-body" style="font-size:${b}px">Fresh produce and live music every Saturday.</div>`;
    const K = `<button class="cl-btn" style="height:${h}px" tabindex="-1">Get tickets</button>`;
    g('cl-card').innerHTML = order === 'tbb' ? T+B+K : K+'<div style="height:16px"></div>'+T+B;
    let score = 100; const fb = [];
    if (t <= b){ score -= 25; fb.push('Title font size must be distinctly larger than body text.'); }
    if (order !== 'tbb'){ score -= 30; fb.push('Incorrect order: title top, body middle, button bottom.'); }
    if (gap % 8 !== 0){ score -= 15; fb.push('Gap between title and body is '+gap+'px. Use multiples of 8.'); }
    if (h < 44){ score -= 30; fb.push('Button height is too small for touch targets (under 44px).'); }
    score = Math.max(0, score);
    g('cl-score').textContent = score + '/100' + (score >= 80 ? ' Passed' : '');
    g('cl-fb').innerHTML = (fb.length ? fb : ['All hierarchy rules passed.']).map(x => '<li>'+esc(x)+'</li>').join('');
  }
  ['cl-title','cl-body','cl-gap','cl-btn','cl-order'].forEach(id => g(id).addEventListener('input', run));
  run();
}

function lum(hex){
  const c = [1,3,5].map(i => parseInt(hex.substr(i,2),16)/255).map(v => v <= 0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4));
  return 0.2126*c[0] + 0.7152*c[1] + 0.0722*c[2];
}
function initContrastLab(){
  const g = id => document.getElementById(id);
  if (!g('ct-fg')) return;
  function run(){
    const fg = g('ct-fg').value, bg = g('ct-bg').value;
    const a = lum(fg), b = lum(bg);
    const ratio = (Math.max(a,b)+0.05)/(Math.min(a,b)+0.05);
    g('ct-sample').style.color = fg; g('ct-sample').style.background = bg;
    g('ct-ratio').textContent = ratio.toFixed(2) + ':1';
    const p = (ok, label) => `<span class="pill ${ok?'done':''}" style="${ok?'':'background:var(--bad-soft);color:var(--bad)'}">${ok?'Pass':'Fail'}: ${label}</span>`;
    g('ct-chk').innerHTML = p(ratio>=4.5,'normal text') + p(ratio>=3,'large text');
  }
  g('ct-fg').addEventListener('input', run); g('ct-bg').addEventListener('input', run);
  run();
}

/* ---------- Quiz ---------- */
let qs = null;
function startQuiz(key){
  const list = key === 'final' ? Q.final.questions : modQ(+key).questions;
  const title = key === 'final' ? Q.final.title : modQ(+key).title;
  qs = {key, list, title, i:0, ans:Array(list.length).fill(null), done:false, mode: key === 'final' ? 'exam' : 'practice'};
}
function quiz(){
  const q = qs.list[qs.i], a = qs.ans[qs.i], last = qs.i === qs.list.length-1;
  const practice = qs.mode === 'practice', answered = a !== null;
  const opts = q.options.map((o, idx) => {
    let cls = '';
    if (practice && answered){ if (idx === q.answer) cls = 'correct'; else if (idx === a) cls = 'wrong'; }
    else if (!practice && idx === a) cls = 'sel';
    return `<button class="opt ${cls}" data-opt="${idx}" ${practice && answered ? 'disabled' : ''}><span class="ltr">${L[idx]}</span><span>${esc(o)}</span></button>`;
  }).join('');
  const fb = practice && answered ? `<div class="explain" role="status"><strong>${a === q.answer ? 'Correct.' : 'Not quite. The answer is '+L[q.answer]+'.'}</strong> ${esc(q.explanation)}</div>` : '';
  const canNext = answered;
  return `<div>
    <a class="back" href="#/${qs.key === 'final' ? '' : 'm/'+qs.key}">Leave quiz</a>
    <p class="muted small" style="margin-bottom:8px">${esc(qs.title)}, question ${qs.i+1} of ${qs.list.length}</p>
    <div class="qbar"><span style="width:${(qs.i+(practice&&answered?1:0))/qs.list.length*100}%"></span></div>
    <h2 style="font-size:clamp(22px,5.5vw,28px)">${esc(q.q)}</h2>
    <div class="opts" role="group" aria-label="Answer options">${opts}</div>
    ${fb}
    <div class="btns">
      ${!practice && qs.i > 0 ? '<button class="btn ghost" data-prev>Previous</button>' : ''}
      <button class="btn" data-next ${canNext ? '' : 'disabled'}>${last ? (practice ? 'See results' : 'Submit exam') : 'Next question'}</button>
    </div></div>`;
}
function finishQuiz(){
  const score = qs.list.reduce((s, q, i) => s + (qs.ans[i] === q.answer ? 1 : 0), 0);
  qs.score = score; qs.done = true;
  const previous = qs.key === 'final' ? store.final : store.quiz[qs.key];
  const rec = {score, bestScore:Math.max(score,previous?.bestScore ?? previous?.score ?? 0), total:qs.list.length, attempts:(previous?.attempts||0)+1};
  if (qs.key === 'final') store.final = Object.assign(rec, {answers: qs.ans.slice()});
  else store.quiz[qs.key] = rec;
  save(); updateProgress();
}
function results(){
  const pct = Math.round(qs.score/qs.list.length*100);
  const best = qs.key==='final' ? store.final?.bestScore : store.quiz[qs.key]?.bestScore;
  const msg = pct >= 80 ? 'Strong work.' : pct >= 60 ? 'Good progress. Review the lessons you missed.' : 'Review the lessons and try again.';
  const isFinal = qs.key === 'final';
  const missed = qs.list.map((q,i) => ({q,i})).filter(x => qs.ans[x.i] !== x.q.answer);
  const review = (!isFinal && missed.length) ? `<div class="card"><h3>Review</h3>${missed.map(x => `<div class="k-q"><strong>${esc(x.q.q)}</strong><div class="k-a">Answer: ${L[x.q.answer]}. ${esc(x.q.options[x.q.answer])}</div><div class="muted small">${esc(x.q.explanation)}</div></div>`).join('')}</div>` : '';
  const nextN = !isFinal ? +qs.key : 0;
  const btns = isFinal
    ? `<a class="btn" href="#/key">Open the answer key</a><button class="btn ghost" data-retry>Retake final</button><a class="btn ghost" href="#/">Course home</a>`
    : `<a class="btn" href="${nextN < C.modules.length ? '#/m/'+(nextN+1) : '#/quiz/final'}">${nextN < C.modules.length ? 'Next module' : 'Start final exam'}</a><button class="btn ghost" data-retry>Retake quiz</button>`;
  return `<div class="stack"><div><p class="muted small">${esc(qs.title)}</p>
    <div class="big-score">${qs.score}/${qs.list.length}</div>
    <p style="margin-top:8px">${pct}%. ${msg}</p>${best>qs.score?'<p class="muted small">Your personal best is '+best+'/'+qs.list.length+'.</p>':''}</div>${review}<div class="btns">${btns}</div></div>`;
}

const SKEY = 'uiux-studio-v1';

const fmtD = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function streak(){
  const set = new Set(st.days); const d = new Date();
  if (!set.has(fmtD(d))) d.setDate(d.getDate()-1);
  let n = 0; while (set.has(fmtD(d))){ n++; d.setDate(d.getDate()-1); }
  return n;
}
const LEVELS = ['Beginner','Sketcher','Observer','Layout Learner','Type Tinkerer','Color Crafter','Flow Finder','Design Pro'];
const XPL = 50;
const lvlOf = xp => Math.min(LEVELS.length, Math.floor(xp/XPL)+1);
function hsl2hex(h,s,l){
  s/=100; l/=100;
  const k = n => (n + h/30) % 12, a = s*Math.min(l,1-l);
  const f = n => l - a*Math.max(-1, Math.min(k(n)-3, Math.min(9-k(n), 1)));
  const x = v => Math.round(v*255).toString(16).padStart(2,'0');
  return '#'+x(f(0))+x(f(8))+x(f(4));
}
function ratioOf(a,b){ const x = lum(a), y = lum(b); return (Math.max(x,y)+0.05)/(Math.min(x,y)+0.05); }
function letter(p){
  const t = [[97,'A+'],[93,'A'],[90,'A-'],[87,'B+'],[83,'B'],[80,'B-'],[77,'C+'],[73,'C'],[70,'C-']];
  for (const r of t) if (p >= r[0]) return r[1];
  return 'D';
}

/* ----- small UI helpers ----- */
function stepper(key,label,min,max,val,disp){
  return '<div class="sl"><div class="sl-top"><label for="sl-'+key+'">'+label+'</label><strong id="slv-'+key+'">'+disp+'</strong></div>'+
    '<div class="sl-row"><button type="button" class="stp" data-k="'+key+'" data-d="-1" aria-label="Decrease">&minus;</button>'+
    '<input id="sl-'+key+'" type="range" min="'+min+'" max="'+max+'" step="1" value="'+val+'" data-k="'+key+'">'+
    '<button type="button" class="stp" data-k="'+key+'" data-d="1" aria-label="Increase">+</button></div></div>';
}
function bindSteppers(root,S,fmt,onchange){
  const apply = (k,v) => { S[k] = v; const o = root.querySelector('#slv-'+k); if (o) o.textContent = fmt(k,v); onchange(k); };
  root.querySelectorAll('input[type=range]').forEach(i => i.addEventListener('input', () => apply(i.dataset.k, +i.value)));
  root.querySelectorAll('.stp').forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.k, i = root.querySelector('#sl-'+k);
    const v = Math.max(+i.min, Math.min(+i.max, +i.value + (+b.dataset.d)));
    i.value = v; apply(k, v);
  }));
}
function seg(group,opts,sel){
  return '<div class="seg" role="group" aria-label="'+group+'">'+opts.map(o =>
    '<button type="button" class="'+(String(o.v)===String(sel)?'on':'')+'" data-g="'+group+'" data-v="'+o.v+'">'+o.t+'</button>').join('')+'</div>';
}
function bindSeg(root,fn){
  root.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
    const g = b.dataset.g;
    root.querySelectorAll('.seg button[data-g="'+g+'"]').forEach(x => x.classList.toggle('on', x === b));
    fn(g, b.dataset.v);
  }));
}
function onActivate(el,fn){
  el.addEventListener('click', fn);
  el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); fn(e); } });
}

    root.innerHTML = '<div class="swr" id="sw"></div><div id="pv" style="margin-top:16px"></div>';

      {ok:!!P.bg && P.bg.k==='neutral', pass:'The background is a calm neutral.', fail:'Paint the background with a calm neutral (Snow, Cloud or Ink).'},
      {ok:!!P.surf && !!P.bg && P.surf.hex!==P.bg.hex && P.surf.k!=='accent', pass:'The card is different from the background without shouting.', fail:'Paint the card with a different, quiet color than the background (not an accent).'},
      {ok:!!P.btn && P.btn.k==='accent', pass:'The button uses a bold accent. It is the 10%.', fail:'Give the button a bold accent color (Tangerine or Violet).'},
      {ok:!!P.btn && !!P.surf && ratioOf(P.btn.hex,P.surf.hex)>=2, pass:'The button clearly stands out from the card.', fail:'The button blends into the card. Pick colors with more difference.'}

{ id:'e8', unit:'Unit 4: Layout and flow', skill:'Layout', title:'Wireframe builder',
  blurb:'Build a recipe detail screen from grey blocks.',

  mount(root){
    const CMP = {hdr:{n:'Header bar',h:40},img:{n:'Image',h:96},txt:{n:'Title and text',h:64},btn:{n:'Primary button',h:48},lst:{n:'Ingredient list',h:84},nav:{n:'Bottom navigation',h:48},ad:{n:'Ad banner',h:52}};
    const blocks = []; let sel = -1;
    root.innerHTML = '<div class="phone" id="ph"></div><div class="btns" id="tools" style="margin:12px 0"></div><strong class="small">Add a block</strong><div class="btns" id="pal" style="margin-top:8px"></div>';
    const ph = root.querySelector('#ph'), tools = root.querySelector('#tools'), pal = root.querySelector('#pal');

      {ok:blocks.length>0 && blocks[blocks.length-1]==='nav', pass:'Navigation sits at the bottom, in easy thumb reach.', fail:'Put the bottom navigation last.'},

/* ----- studio screens ----- */
function isUnlocked(id){ const i = EX.findIndex(e => e.id===id); return i<=0 || !!st.ex[EX[i-1].id]; }
function studioStats(){
  const done = EX.filter(e => st.ex[e.id]);
  const avg = done.length ? done.reduce((s,e) => s+st.ex[e.id].best,0)/done.length*100 : null;
  const p1 = Object.values(store.quiz).map(r => (r.bestScore??r.score)/r.total*100);
  if (store.final) p1.push((store.final.bestScore??store.final.score)/store.final.total*100);
  const p1avg = p1.length ? p1.reduce((a,b) => a+b,0)/p1.length : null;
  const parts = [avg,p1avg].filter(x => x!==null);
  const overall = parts.length ? parts.reduce((a,b) => a+b,0)/parts.length : null;
  return {done:done.length, avg, p1avg, overall};
}

  const s = studioStats(), lv = lvlOf(st.xp);

let run = null;
function initEx(id){
  const ex = EX.find(e => e.id===id), mt = document.getElementById('st-mount');
  if (!ex || !mt) return;
  const rulesFn = ex.mount(mt);
  run = {id:id, rulesFn:rulesFn, last:null};
  document.getElementById('st-check').addEventListener('click', () => {
    const rs = rulesFn(); run.last = rs;
    const ok = rs.filter(r => r.ok).length, n = rs.length, all = ok===n;
    const fb = document.getElementById('st-fb');
    const msg = all ? 'Every rule is satisfied. That is real design thinking.' : ok>=n*0.7 ? 'You are really close. Adjust and check again, or finish now.' : 'Good start. Read the hints below and tweak a little.';
    fb.innerHTML = '<div class="card fb-card'+(all?' win':'')+'"><h3>'+(all ? 'You nailed it!' : ok+' of '+n+' done')+'</h3><p class="muted" style="margin-top:6px">'+msg+'</p>'+
      '<ul class="rl">'+rs.map(r => '<li class="'+(r.ok?'ok':'no')+'"><span class="mark">'+(r.ok?'✓':'○')+'</span><span>'+esc(r.ok?r.pass:r.fail)+'</span></li>').join('')+'</ul>'+
      '<div class="btns"><button type="button" class="btn'+(all?'':' ghost')+'" id="st-fin">'+(all?'Finish and collect XP':'Finish with '+ok+'/'+n)+'</button></div></div>';
    document.getElementById('st-fin').addEventListener('click', () => finishEx(id, ok/n));
    fb.scrollIntoView({behavior:'smooth', block:'nearest'});
  });
}
const GOOD3 = ['Flawless!','Look at you go!','That is designer-level work.','Perfect. Seriously impressive.'];
const GOOD2 = ['Great work!','Nicely done, almost perfect.','You are clearly getting it.'];
const GOOD1 = ['You finished it, and that is how skill is built.','Good start. Every try makes the next one easier.','Done! Tap Try again to earn more stars.'];
const pick = a => a[Math.floor(Math.random()*a.length)];
function finishEx(id,pct){
  const prev = st.ex[id] || {best:0,stars:0,xp:0,tries:0};
  const stars = pct>=1 ? 3 : pct>=0.7 ? 2 : 1, xp = 10 + stars*10;
  const lvBefore = lvlOf(st.xp), gain = Math.max(0, xp - prev.xp);
  st.ex[id] = {best:Math.max(prev.best,pct), stars:Math.max(prev.stars,stars), xp:Math.max(prev.xp,xp), tries:prev.tries+1, firstPerfect:!!prev.firstPerfect || (prev.tries===0 && pct>=1)};
  st.xp += gain;
  const d = fmtD(new Date()); if (!st.days.includes(d)){ st.days.push(d); st.days = st.days.slice(-90); }
  const fresh = awardBadges(); saveSt();
  const lvAfter = lvlOf(st.xp), idx = EX.findIndex(e => e.id===id), next = EX[idx+1];
  const msg = stars===3 ? pick(GOOD3) : stars===2 ? pick(GOOD2) : pick(GOOD1);
  const rs = run && run.last ? run.last : [];
  const got = rs.filter(r => r.ok), miss = rs.filter(r => !r.ok);
  app.innerHTML = '<div class="stack results"><div class="center"><div class="stars" aria-label="'+stars+' of 3 stars">'+[1,2,3].map(n => '<span class="'+(n<=stars?'on':'')+'" style="animation-delay:'+(n*0.18)+'s">★</span>').join('')+'</div>'+
    '<h1 style="font-size:clamp(32px,9vw,46px);margin-top:12px">'+msg+'</h1><p class="muted" style="margin-top:8px">'+Math.round(pct*100)+'% on '+esc(EX[idx].title)+' ('+letter(pct*100)+')</p></div>'+
    '<section class="card"><div class="xp-row"><strong class="xp-gain">+'+gain+' XP</strong><span class="muted">'+st.xp+' XP total</span></div>'+
    (lvAfter>lvBefore ? '<div class="idea" style="margin-top:12px"><strong>Level up!</strong> You are now level '+lvAfter+': '+LEVELS[lvAfter-1]+'.</div>' : '')+
    (gain===0 ? '<p class="muted small" style="margin:8px 0 0">You already earned this much XP here. Get more stars to earn more.</p>' : '')+'</section>'+
    (fresh.length ? '<section class="card"><h3>New badge'+(fresh.length>1?'s':'')+'</h3>'+fresh.map(b => '<div class="k-q"><strong>'+b.i+'&nbsp; '+b.n+'</strong><div class="muted small">'+b.d+'</div></div>').join('')+'</section>' : '')+
    (got.length ? '<section class="card"><h3>What you got right</h3><ul class="rl">'+got.map(r => '<li class="ok"><span class="mark">✓</span><span>'+esc(r.pass)+'</span></li>').join('')+'</ul>'+
      (miss.length ? '<h3 style="margin-top:8px">Next time</h3><ul class="rl">'+miss.map(r => '<li class="no"><span class="mark">○</span><span>'+esc(r.fail)+'</span></li>').join('')+'</ul>' : '')+'</section>' : '')+
    '<div class="btns">'+(next ? '<button type="button" class="btn" data-go="#/studio/ex/'+next.id+'">Next challenge</button>' : '<button type="button" class="btn" data-go="#/studio">See your progress</button>')+
    '<button type="button" class="btn ghost" data-go="#/studio/ex/'+id+'">Try again</button><button type="button" class="btn ghost" data-go="#/studio">Back to the path</button></div></div>';
  app.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => {
    const h = b.dataset.go;
    if (location.hash === h) render(true); else location.hash = h;
  }));
  window.scrollTo(0,0);
  if (stars>=2 || lvAfter>lvBefore) confetti();
}
function confetti(){
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv = document.createElement('canvas'); cv.className = 'confetti'; cv.width = innerWidth; cv.height = innerHeight; document.body.appendChild(cv);
  const g = cv.getContext('2d'), cols = ['#F5B301','#2B50E6','#12805C','#FF6B2C','#8AA2FF'];
  const ps = Array.from({length:90}, () => ({x:innerWidth/2, y:innerHeight*0.3, vx:(Math.random()-0.5)*13, vy:-Math.random()*12-4, s:6+Math.random()*6, c:cols[Math.floor(Math.random()*cols.length)], r:Math.random()*6}));
  let f = 0;
  (function tick(){
    g.clearRect(0,0,cv.width,cv.height);
    ps.forEach(p => { p.vy += 0.35; p.x += p.vx; p.y += p.vy; p.r += 0.2; g.save(); g.translate(p.x,p.y); g.rotate(p.r); g.fillStyle = p.c; g.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.6); g.restore(); });
    f++; if (f<110) requestAnimationFrame(tick); else cv.remove();
  })();
}


/* ---------- Router ---------- */
function render(scroll){
  const h = location.hash.replace(/^#\/?/, '');
  const parts = h.split('/');
  let html;
  if (parts[0] === 'm' && parts[1]) html = module(+parts[1]);
  else if (parts[0] === 'quiz' && parts[1]){
    if (!qs || qs.key !== parts[1] || (qs.done && scroll)) startQuiz(parts[1]);
    html = qs.done ? results() : quiz();
  }
  else if (parts[0] === 'studio') html = parts[1] === 'ex' ? exPage(parts[2]) : studioHome();
  else if (parts[0] === 'key') html = key();
  else html = home();
  app.innerHTML = html;
  initCardLab(); initContrastLab(); initTestPlanLab();
  if (parts[0] === 'studio' && parts[1] === 'ex') initEx(parts[2]);
  const dt = document.getElementById('demo-toggle');
  if (dt) dt.addEventListener('click', () => {
    const on = document.getElementById('demo').classList.toggle('on');
    dt.textContent = on ? 'Remove hierarchy' : 'Add hierarchy';
    dt.setAttribute('aria-pressed', on);
  });
  if (scroll) window.scrollTo(0, 0);
  updateProgress();
}
window.addEventListener('hashchange', () => { if (C) render(true); });
app.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t || !qs) return;
  if (t.dataset.opt !== undefined){
    if (qs.mode === 'practice' && qs.ans[qs.i] !== null) return;
    qs.ans[qs.i] = +t.dataset.opt; render(false);
  } else if (t.hasAttribute('data-next')){
    const submitted = qs.i === qs.list.length-1;
    if (submitted) finishQuiz(); else qs.i++;
    render(!submitted);
  } else if (t.hasAttribute('data-prev')){ qs.i--; render(true); }
  else if (t.hasAttribute('data-retry')){ startQuiz(qs.key); render(true); }
});
app.innerHTML = '<p class="muted">Loading your learning studio...</p>';
Promise.all([
  fetch('data/curriculum.json').then(r => { if (!r.ok) throw new Error('Curriculum request failed: '+r.status); return r.json(); }),
  fetch('data/quiz.json').then(r => { if (!r.ok) throw new Error('Quiz request failed: '+r.status); return r.json(); })
])
  .then(([c, q]) => { C = c; Q = q; render(true); })
  .catch(error => { console.error('Learnme could not load course data.',error); app.innerHTML = '<div class="card"><h3>Could not load the course</h3><p>The course data could not be loaded. Check your connection and confirm the <code>data</code> folder is deployed next to this page.</p><button class="btn" type="button" onclick="location.reload()">Try again</button></div>'; });
})();
</script>
